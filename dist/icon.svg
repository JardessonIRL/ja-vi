<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2550"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fcd34d"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <g id="reel">
      <circle r="60" fill="#f8fafc"/>
      <circle r="60" fill="none" stroke="#cbd5e1" stroke-width="5"/>
      <g fill="#131a36">
        <circle cx="0" cy="-34" r="13"/>
        <circle cx="32.3" cy="-10.5" r="13"/>
        <circle cx="20" cy="27.5" r="13"/>
        <circle cx="-20" cy="27.5" r="13"/>
        <circle cx="-32.3" cy="-10.5" r="13"/>
        <circle r="8"/>
      </g>
    </g>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- everything stays inside the maskable safe zone -->
  <g transform="translate(256 262) scale(0.86) translate(-262 -262)">
    <!-- tripod -->
    <g stroke="#94a3b8" stroke-width="14" stroke-linecap="round">
      <line x1="226" y1="352" x2="168" y2="438"/>
      <line x1="226" y1="352" x2="226" y2="438"/>
      <line x1="226" y1="352" x2="284" y2="438"/>
    </g>
    <!-- reels -->
    <use href="#reel" transform="translate(172 150)"/>
    <use href="#reel" transform="translate(292 166) scale(0.78)"/>
    <!-- lens hood -->
    <path d="M338 262 L414 226 Q424 222 424 233 L424 345 Q424 356 414 352 L338 316 Z" fill="#f59e0b"/>
    <path d="M338 262 L414 226 Q424 222 424 233 L424 345 Q424 356 414 352 L338 316 Z" fill="#000" opacity=".12"/>
    <!-- body -->
    <rect x="112" y="222" width="234" height="134" rx="22" fill="url(#body)"/>
    <rect x="134" y="246" width="92" height="50" rx="10" fill="#131a36" opacity=".9"/>
    <circle cx="300" cy="272" r="13" fill="#ef4444"/>
    <rect x="134" y="316" width="190" height="10" rx="5" fill="#131a36" opacity=".28"/>
  </g>
</svg>
